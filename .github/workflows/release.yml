name: release

# Publishes the packages to nuget.org for a pushed tag v<version>, through trusted publishing: nuget.org trusts this
# workflow file of this repository and hands out a key valid for one hour, so no key is stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # the nuget.org login

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check that the tag matches the version
        run: |
          version=$(dotnet msbuild src/Postilio.Client/Postilio.Client.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version in src/Directory.Build.props." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: ./build.sh
        env:
          CI: true
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the packages
        # --skip-duplicate makes a re-run safe once a package of this version is on nuget.org.
        run: dotnet nuget push "artifacts/packages/$VERSION/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create the GitHub release, or add the packages to one made by hand
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/packages/"$VERSION"/*.nupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/packages/"$VERSION"/*.nupkg --verify-tag --generate-notes $([[ "$VERSION" == *-* ]] && echo --prerelease)
          fi
        env:
          GH_TOKEN: ${{ github.token }}
